openapi: 3.0.3
info:
  title: Platform API
  version: 0.5.0-pr5
  description: PR-5 order submission and brand approval workflow.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health
      responses: { '200': { description: OK } }
  /api/auth/login:
    post:
      summary: Login
      responses: { '200': { description: OK } }
  /api/auth/refresh:
    post:
      summary: Refresh
      responses: { '200': { description: OK } }

  /api/admin/products:
    get:
      summary: Admin list products
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /api/admin/products/{productId}/moderate:
    post:
      summary: Admin moderate product
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK } }
  /api/admin/campaigns/{campaignId}/override:
    post:
      summary: Admin override campaign status/lock
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK } }
  /api/admin/orders:
    get:
      summary: Admin full order visibility
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses: { '200': { description: OK } }
  /api/admin/orders/{orderId}/override:
    post:
      summary: Admin override order status
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [DRAFT, SUBMITTED, BRAND_APPROVED, BRAND_REJECTED, ENDED] }
                note: { type: string }
      responses: { '200': { description: OK } }
  /api/admin/partners/{partnerId}:
    get:
      summary: Admin partner detail
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK } }
  /api/admin/partners/{partnerId}/kyc/decision:
    post:
      summary: Admin KYC decision
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK } }
  /api/admin/partners/{partnerId}/bank/verify:
    post:
      summary: Admin verify bank
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK } }

  /api/brand/products:
    get:
      summary: Brand list products
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
    post:
      summary: Brand create product
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created } }
  /api/brand/products/{productId}:
    put:
      summary: Brand update product
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK }, '423': { description: Locked } }
  /api/brand/products/{productId}/archive:
    post:
      summary: Brand archive product
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK } }

  /api/brand/campaigns:
    get:
      summary: Brand list campaigns
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
    post:
      summary: Brand create campaign
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
      responses: { '201': { description: Created } }
  /api/brand/campaigns/{campaignId}:
    put:
      summary: Brand update campaign
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK }, '423': { description: Locked } }
  /api/brand/campaigns/{campaignId}/status:
    post:
      summary: Brand change campaign status
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK } }
  /api/brand/campaigns/{campaignId}/products:
    put:
      summary: Brand map products to campaign
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK } }
  /api/brand/campaigns/{campaignId}/eligibility:
    put:
      summary: Brand configure campaign eligibility
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK } }

  /api/brand/orders:
    get:
      summary: Brand list scoped orders
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses: { '200': { description: OK } }
  /api/brand/orders/{orderId}/decision:
    post:
      summary: Brand approve/reject submitted order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [BRAND_APPROVED, BRAND_REJECTED] }
                reason: { type: string }
      responses: { '200': { description: OK } }

  /api/partner/campaigns:
    get:
      summary: Partner browse eligible ACTIVE campaigns
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /api/partner/products:
    get:
      summary: Partner browse products from eligible active campaigns
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /api/partner/orders:
    get:
      summary: Partner list own orders
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses: { '200': { description: OK } }
    post:
      summary: Partner create DRAFT order
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignId, productId, amount, quantity]
              properties:
                campaignId: { type: integer }
                productId: { type: integer }
                amount: { type: integer }
                quantity: { type: integer }
                notes: { type: string }
      responses: { '201': { description: Created } }
  /api/partner/orders/{orderId}/submit:
    post:
      summary: Partner submit DRAFT order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer }
      responses: { '200': { description: OK } }

  /api/partner/profile:
    get: { summary: Get partner profile, security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
    put: { summary: Update partner profile, security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /api/partner/kyc:
    get: { summary: Get partner KYC, security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
    post: { summary: Submit partner KYC, security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /api/partner/bank:
    get: { summary: Get partner bank masked, security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
    put: { summary: Update partner bank, security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }

  /api/brand/partners/{partnerId}/kyc:
    get:
      summary: Forbidden for BRAND
      security: [{ bearerAuth: [] }]
      responses: { '403': { description: Forbidden } }
  /api/brand/partners/{partnerId}/bank:
    get:
      summary: Forbidden for BRAND
      security: [{ bearerAuth: [] }]
      responses: { '403': { description: Forbidden } }
  /api/audit-logs:
    get:
      summary: Admin audit logs
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CampaignInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        marketplace: { type: string }
        startAt: { type: string }
        endAt: { type: string }
        targetReviews: { type: integer }
        budget: { type: integer }
        guidelines: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ENDED] }
